[project]
name = "plaud-scribe"
version = "0.1.0"
description = "Sync Plaud recordings, re-transcribe with ElevenLabs Scribe v2, file the results in Google Drive."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "elevenlabs>=1.50",
    "lingua-language-detector>=2.0",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "anthropic>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
plaud-scribe = "plaud_scribe.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
